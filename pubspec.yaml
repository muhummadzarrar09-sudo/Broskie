name: broskie_game
description: A neon-soaked platformer vertical slice built with Flutter and Flame.
version: 0.3.0+3
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flame: ^1.38.0
  flame_audio: ^2.12.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flame_test: ^2.3.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/skyline_far.png
    - assets/images/skyline_near.png
    - assets/images/runtime/
