name: broskie_game
description: A neon-soaked platformer vertical slice built with Flutter and Flame.
version: 0.2.0+2
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flame: ^1.37.0
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5

dev_dependencies:
  flame_test: ^2.2.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
